name: Release APK (signed)
on: workflow_dispatch
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses (already installed on runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing secret KEYSTORE_BASE64 (see README)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and build release APK
        env:
          SAFEVAULT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SAFEVAULT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SAFEVAULT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SAFEVAULT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :crypto-core:test :app:testDebugUnitTest :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: SafeVault-release-apk
          path: app/build/outputs/apk/release/*.apk
